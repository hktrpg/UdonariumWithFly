# Keep src/environments/version.ts in sync with the triggering commit.
# Local `npx ng serve` skips npm prestart; CI still stamps the repo for production / peer UI.
name: Update app version stamp

on:
  push:
    branches: [hktrpg-main, fix]
  workflow_dispatch:

concurrency:
  group: update-app-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need commit metadata for date; token so later push works on protected setups that allow GITHUB_TOKEN.
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write version.ts
        run: npm run version:git
        env:
          # Prefer the commit that triggered this workflow (not a follow-up chore SHA).
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/environments/version.ts
          if git diff --staged --quiet; then
            echo "version.ts already up to date"
            exit 0
          fi
          git commit -m "chore: bump app version stamp [skip ci]"
          git push
