<div id="app-table-layer" data-tour-id="table.layer" [class.is-card-drop-target]="tableDropHighlight" style="position: absolute; width: 100%; height: 100%; overflow: hidden;">
  <game-table></game-table>
</div>

<!-- Desktop: FVTT-style slim icon rail (52px). -->
<nav *ngIf="!isMobileLayout" class="desktop-icon-rail" data-tour-id="menu.main" data-geometry-key="menu.main"
  [class.vertical]="!isHorizontal" [class.horizontal]="isHorizontal"
  [attr.aria-label]="'menu.title' | i18n">
  <ul>
    <li *ngFor="let item of desktopMenuItems"
      [attr.data-tour-id]="item.tourId"
      [class.is-active]="isDesktopNavActive(item)"
      [appTeachingTip]="item.tipKey"
      [attr.title]="item.labelKey | i18n"
      (click)="onDesktopMenuClick(item, $event)">
      <a routerLink="/" routerLinkActive="active" [style.pointer-events]="item.kind === 'contextMenu' || item.kind === 'logout' ? 'none' : null"
        [attr.aria-label]="item.labelKey | i18n">
        <div class="menu-icon-slot">
          <div class="menu-icon-glyph">
            <i class="material-icons icon-size">{{ item.icon }}</i>
          </div>
          <div class="menu-badge-layer" aria-hidden="true">
            <span *ngIf="item.badge === 'chat' && showChatUnreadBadge" class="menu-chat-badge">{{ chatUnreadBadgeLabel }}</span>
            <span *ngIf="item.badge === 'update' && showAppUpdateBadge" class="menu-update-dot"
              [attr.title]="(appUpdate.installFailed ? 'update.failedHint' : 'update.readyHint') | i18n"></span>
          </div>
        </div>
      </a>
    </li>
  </ul>
</nav>

<!-- Phone / tablet: Play or Edit — bottom nav or side rail via chromeMode class -->
<hand-rail></hand-rail>
<nav *ngIf="isMobileLayout"
  [class.mobile-bottom-nav]="!isTabletLandscape"
  [class.mobile-side-rail]="isTabletLandscape"
  [attr.aria-label]="isMobileEdit ? 'Edit menu' : 'Play menu'"
  (contextmenu)="$event.preventDefault()">
  <ul>
    <li *ngFor="let item of mobileNavItems"
      [attr.data-tour-id]="item.tourId"
      [class.is-active]="isNavActive(item.tourId)"
      [appTeachingTip]="item.tipKey"
      (click)="onMobileNavClick(item, $event)">
      <a routerLink="/" routerLinkActive="active" style="pointer-events: none"
        [attr.aria-label]="item.labelKey | i18n"
        [attr.title]="item.labelKey | i18n">
        <div class="menu-icon-slot">
          <div class="menu-icon-glyph">
            <i class="material-icons" [class.icon-size]="!isTabletLandscape">{{ item.icon }}</i>
          </div>
          <div class="menu-badge-layer" aria-hidden="true">
            <span *ngIf="item.chatBadge && showChatUnreadBadge" class="menu-chat-badge">{{ chatUnreadBadgeLabel }}</span>
            <span *ngIf="item.updateBadge && showAppUpdateBadge" class="menu-update-dot"></span>
          </div>
        </div>
      </a>
    </li>
  </ul>
</nav>

<div #modalLayer></div>
<teaching-tip></teaching-tip>
<guided-tour></guided-tour>
<combat-announce></combat-announce>
<table-timer *ngFor="let timer of timerService.fullCanvasTimers" [timer]="timer"></table-timer>
<table-timer-compact-hud [timers]="timerService.compactCanvasTimers"></table-timer-compact-hud>
<note-handout></note-handout>
<scene-nav></scene-nav>
<pause-overlay></pause-overlay>
<connection-busy-overlay></connection-busy-overlay>
<div class="ephemeral-notice" *ngIf="audioRejectToastLines.length"
  role="status" aria-live="polite" aria-atomic="true">
  <div class="ephemeral-notice-title">{{ 'jukebox.reject.title' | i18n }}</div>
  <div class="ephemeral-notice-line" *ngFor="let line of audioRejectToastLines">{{ line }}</div>
</div>
<character-resource-hud></character-resource-hud>
<music-hud></music-hud>
<network-indicator class="networkIndicator"></network-indicator>
<div *ngIf="imageUrl" class="image-view-background is-fill" (click)="closeImagePreview()" [@fadeInOut]="'in'">
  <div class="close-button is-pointer-events-none" style="z-index: 10"><i class="material-icons">close</i></div>
  <img class="contain-image" [src]="imageUrl | safe: 'resourceUrl'" draggable="false" />
</div>
