<form #passwordForm="ngForm">
  <div>{{ 'pass.label' | i18n }}: <input #input [(ngModel)]="password" (input)="onInputChange(input.value)" (keypress.enter)="submit()" [ngModelOptions]="{standalone: true}" [placeholder]="'pass.placeholder' | i18n" #passwordInput /></div>
  <button type="submit" (click)="submit()"><b>{{ 'pass.submit' | i18n }}</b></button>
</form>
<div>
  <span style="font-size: 12px;">{{help}}</span>
</div>
