<div class="flex-container" *ngIf="!GuestMode()">
  <div class="flex-item no-grow">
    <div>
      <button style="margin: 0px 0px 2px 0px; font-size: smaller" (click)="add()">{{ 'diceTable.add' | i18n }}</button>
    </div>
    <select #diceRollTableSelecter style="width: 14em;" size="15" (change)="onChangeDiceRollTable(diceRollTableSelecter.value)">
      <option *ngFor="let diceRollTable of diceRollTables" value="{{ diceRollTable.identifier }}" title="{{diceRollTable.name}}" [style.color]="diceRollTable.name == '' ? 'gray' : ''">{{ diceRollTable.name == '' ? ('diceTable.unnamed' | i18n) : diceRollTable.name }}</option>
    </select>
  </div>
  <div class="flex-item">
    <button style="float: right; cursor: help" (click)="helpDiceRollTable()">?</button>
    <ng-container *ngIf="!isEmpty && selectedDiceRollTable">
      <div style="font-size: smaller;">
        <div style="margin-bottom: 3px;">
          <b>{{ 'diceTable.name' | i18n }}: </b>
          <input style="width: 60%; min-width: 5em" [(ngModel)]="diceRollTableName" [placeholder]="'diceTable.name' | i18n" [attr.disabled]="!isEditable ? '' : null" />
        </div>
        <div>
          <span style="white-space: nowrap">
            <b>{{ 'diceTable.command' | i18n }}: </b>
            <input style="width: 7em" [(ngModel)]="diceRollTableCommand" [placeholder]="'diceTable.command' | i18n" [attr.disabled]="!isEditable ? '' : null" />
          </span>
          <span style="white-space: nowrap; margin-left: 1em">  
            <b>{{ 'diceTable.dice' | i18n }}: </b>
            <input style="width: 3.3em; text-align: center" [(ngModel)]="diceRollTableDice" [placeholder]="'diceTable.dice' | i18n" [attr.disabled]="!isEditable ? '' : null" />
          </span>
        </div>
      </div>
      <div>
        <textarea style="width: 100%; height: 20em; margin-top: 3px; resize: vertical;" [placeholder]="'diceTable.textPlaceholder' | i18n" [(ngModel)]="diceRollTableText" [attr.disabled]="!isEditable ? '' : null" ></textarea>
      </div>
      <hr/>
      <div>
        <ng-container *ngIf="!isDeleted">
          <button (click)="upTabIndex()">↑</button>
          <button (click)="downTabIndex()">↓</button>
          <div style="float: right">
            <!--
            <button [disabled]="isSaveing || !diceRollTables.length" (click)="saveAll()">
              <div style="position: relative;">
                <div [ngClass]="{'is-hidden': isSaveing}">{{ 'diceTable.saveAll' | i18n }}</div>
                <div *ngIf="isSaveing" class="progress">{{progresPercent}}%</div>
              </div>
            </button>
            -->
            <button [disabled]="isSaveing" (click)="save()">
              <div style="position: relative;">
                <div [ngClass]="{'is-hidden': isSaveing}">{{ 'diceTable.save' | i18n }}</div>
                <div *ngIf="isSaveing" class="progress">{{progresPercent}}%</div>
              </div>
            </button>
            <button class="danger" (click)="delete()">{{ 'diceTable.delete' | i18n }}</button>
          </div>
        </ng-container>
        <ng-container *ngIf="isDeleted && selectedDiceRollTableXml">
          <button (click)="restore()">{{ 'diceTable.restore' | i18n }}</button>
        </ng-container>
      </div>
    </ng-container>
  </div>
</div>
<ng-container *ngIf="isEmpty">
  <div style="font-size: 12px;">
    {{ 'diceTable.empty' | i18n }}
    <ng-container *ngIf="isDeleted && selectedDiceRollTableXml">
      <button (click)="restore()">{{ 'diceTable.restore' | i18n }}</button>
    </ng-container>
  </div>
</ng-container>
