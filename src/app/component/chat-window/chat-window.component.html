<!--<h2>聊天系統</h2>-->
<div class="component">
<div class="log">
  <chat-tab #chatTabComponemt *ngIf="chatTab" [chatTab]="chatTab" [compact]="isCompact" [leftOnly]="isLeftOnly" (onAddMessage)="scrollToBottom()"></chat-tab>
  <div *ngIf="!chatTab">※聊天標籤的內容已更新。請重新選擇聊天標籤，或重新開啟此聊天視窗。</div>
</div>
<div class="sticky-bottom" [ngClass]="{'is-clarify': ClarifyModeActive()}">
  <form *ngIf="!ClarifyModeActive()">
    <div class="chat-toolbar">
      <div class="chat-tab">
        <label *ngFor="let chatTab of chatMessageService.chatTabs; trackBy: trackByChatTab" class="tab">
          <input name="chat-tab" type="radio" value="{{chatTab.identifier}}" ng-control="options" [(ngModel)]="chatTabidentifier">
          <div><span [style.cursor]="chatTabidentifier != chatTab.identifier ? 'pointer' : ''" [style.color]="chatTab.name == '' && chatTabidentifier != chatTab.identifier ? 'gray' : ''">{{chatTab.name == '' ? '(未命名標籤)' : chatTab.name}}</span><i *ngIf="chatTab.isUseStandImage" class="material-icons small-font">how_to_reg</i><i *ngIf="chatTab.recieveOperationLogLevel > 0" class="material-icons small-font">history_edu</i><badge *ngIf="chatTab.hasUnread" class="badge" [count]="chatTab.unreadLength"></badge></div>
        </label>
        <button type="button" class="tab-setting small-font" (click)="showTabSetting()" *ngIf="!GuestMode()"><i class="material-icons small-font">settings</i>標籤</button>
        <button type="button" class="tab-setting small-font" (click)="showLogOutput()" *ngIf="!GuestMode()"><i class="material-icons small-font">history_edu</i>日誌</button>
      </div>
      <div class="chat-toolbar-actions">
        <button type="button" class="indicate" style="font-size: 0.8em; padding: 2px 5px" title="音樂：ON＝播放 BGM／OFF＝靜音（本機設定）" [ngClass]="{'is-active': isMusicOn}" (click)="toggleMusic()">
          <i class="material-icons" style="font-size: 1em">{{ isMusicOn ? 'music_note' : 'music_off'}}</i>
          <sup style="color: red">*</sup>
        </button>
        <button type="button" class="indicate" style="font-size: 0.8em; padding: 2px 5px" title="效果音：ON＝播放音效／OFF＝靜音（本機設定）" [ngClass]="{'is-active': isSoundEffectOn}" (click)="toggleSoundEffect()">
          <i class="material-icons" style="font-size: 1em">{{ isSoundEffectOn ? 'volume_up' : 'volume_off'}}</i>
          <sup style="color: red">*</sup>
        </button>
        <button type="button" class="indicate" style="font-size: 0.8em; padding: 2px 5px" title="提示音：ON＝有人發言時播放／OFF＝不播放（本機設定）" [ngClass]="{'is-active': isNoticeOn}" (click)="isNoticeOn = !isNoticeOn">
          <i class="material-icons" style="font-size: 1em">{{ isNoticeOn ? 'notifications_active' : 'notifications_paused'}}</i>
          <sup style="color: red">*</sup>
        </button>
        <button type="button" class="indicate" style="font-size: 0.8em; padding: 2px 2px" title="訊息靠左：ON＝一律靠左／OFF＝左右對開（本機設定）" [ngClass]="{'is-active': isLeftOnly}" (click)="isLeftOnly = !isLeftOnly">
          <i class="material-icons" [ngStyle]="{'font-size': isLeftOnly ? '1em' : '1.3em' }">{{ isLeftOnly ? 'arrow_forward' : 'compare_arrows'}}</i>
          <sup style="color: red">*</sup>
        </button>
        <button type="button" class="indicate" style="font-size: 0.8em; padding: 2px 5px" title="訊息顯示：ON＝一般氣泡／OFF＝精簡列表（本機設定）" [ngClass]="{'is-active': isCompactOff}" (click)="toggleCompact()">
          <i class="material-icons" style="font-size: 1em">{{ isCompactOff ? 'forum' : 'list'}}</i>
          <sup style="color: red">*</sup>
        </button>
        <button type="button" class="indicate" style="font-size: 0.8em; padding: 2px 5px" title="工具列：ON＝完整顯示／OFF＝精簡（只留輸入區）（本機設定）" [ngClass]="{'is-active': isClarifyOff}" (click)="toggleClarifyMode()">
          <i class="material-icons" style="font-size: 1em">{{ isClarifyOff ? 'view_agenda' : 'view_day'}}</i>
          <sup style="color: red">*</sup>
        </button>
      </div>
    </div>
  </form>
  <chat-input [chatTabidentifier]="chatTabidentifier" [(gameType)]="gameType" [(sendFrom)]="sendFrom" (chat)="sendChat($event)"></chat-input>
  <button *ngIf="ClarifyModeActive()" type="button" class="clarify-restore" title="結束精簡：顯示標籤列與工具列" (click)="toggleClarifyMode()">
    <i class="material-icons">view_agenda</i>
  </button>
</div>
