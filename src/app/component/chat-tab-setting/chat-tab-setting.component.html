<div class="settings-ui settings-layout">
  <aside class="settings-aside">
    <button type="button" class="btn btn-primary btn-block" (click)="create()">
      <i class="material-icons">add</i>{{ 'chatTab.create' | i18n }}
    </button>
    <select
      #select
      class="settings-list"
      size="10"
      (change)="onChangeSelectTab(select.value)"
      [ngModel]="selectedTab?.identifier"
    >
      <option
        *ngFor="let chatTab of chatTabs"
        [value]="chatTab.identifier"
        [title]="chatTab.name"
        [class.is-unnamed]="chatTab.name == ''"
      >
        {{ chatTab.name == '' ? ('chatTab.untitled' | i18n) : chatTab.name }}
      </option>
    </select>
  </aside>

  <main class="settings-main" *ngIf="!isEmpty && selectedTab">
    <section class="card">
      <header class="card-head"><h3>{{ 'chatTab.name' | i18n }}</h3></header>
      <div class="field-row">
        <label class="field grow" [class.disabled]="!isEditable">
          <span>{{ 'chatTab.name' | i18n }}</span>
          <input
            type="text"
            [(ngModel)]="tabName"
            [placeholder]="'chatTab.namePlaceholder' | i18n"
            [disabled]="!isEditable"
          />
        </label>
      </div>
      <div class="check-row">
        <label [class.disabled]="!isEditable" [style.cursor]="isEditable ? 'pointer' : 'default'">
          <input
            type="checkbox"
            [(ngModel)]="isUseStandImage"
            [disabled]="!isEditable"
          />
          {{ 'chatTab.enableStand' | i18n }}
        </label>
        <label [class.disabled]="!isEditable" [style.cursor]="isEditable ? 'pointer' : 'default'">
          <input
            type="checkbox"
            [ngModel]="recieveOperationLogLevel > 0"
            (ngModelChange)="recieveOperationLogLevel = $event ? 1 : 0"
            [disabled]="!isEditable"
          />
          {{ 'chatTab.showOperationLog' | i18n }}
        </label>
      </div>
    </section>

    <footer class="actions">
      <ng-container *ngIf="!isDeleted">
        <button type="button" class="btn btn-sm" (click)="upTabIndex()">↑</button>
        <button type="button" class="btn btn-sm" (click)="downTabIndex()">↓</button>
        <span class="actions-spacer">
          <button type="button" class="btn" (click)="showLogOutput()">
            <i class="material-icons">history_edu</i>{{ 'chatTab.log' | i18n }}
          </button>
          <button type="button" class="btn" [disabled]="isSaveing" (click)="save()">
            <span class="btn-label" [class.is-hidden]="isSaveing">{{ 'chatTab.download' | i18n }}</span>
            <span *ngIf="isSaveing" class="btn-progress">{{progresPercent}}%</span>
          </button>
          <button
            type="button"
            class="btn btn-danger"
            (click)="delete()"
            [disabled]="chatTabs.length <= 1"
          >
            {{ 'chatTab.delete' | i18n }}
          </button>
        </span>
      </ng-container>
      <ng-container *ngIf="isDeleted">
        <button type="button" class="btn" (click)="restore()">{{ 'chatTab.restore' | i18n }}</button>
      </ng-container>
    </footer>
  </main>
</div>

<div class="settings-ui empty-hint" *ngIf="isEmpty">
  {{ 'chatTab.empty' | i18n }}
</div>
