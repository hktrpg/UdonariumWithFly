<div class="scene-tools" [class.collapsed]="!tools.paletteOpen">
  <button type="button" class="toggle" (click)="toggle()" title="場景工具">
    <i class="material-icons">{{ tools.paletteOpen ? 'chevron_left' : 'construction' }}</i>
  </button>
  <div class="palette" *ngIf="tools.paletteOpen">
    <div class="title">場景工具</div>
    <button type="button" [class.active]="tools.mode === 'select'" (click)="setMode('select')" title="選取">
      <i class="material-icons">near_me</i><span>選取</span>
    </button>
    <button type="button" [class.active]="tools.mode === 'light'" (click)="setMode('light')" [disabled]="isGuest" title="燈光">
      <i class="material-icons">lightbulb</i><span>燈光</span>
    </button>
    <button type="button" [class.active]="tools.mode === 'wall'" (click)="setMode('wall')" [disabled]="isGuest" title="牆壁">
      <i class="material-icons">fence</i><span>牆壁</span>
    </button>
    <div class="sub">繪圖</div>
    <button type="button" [class.active]="tools.mode === 'draw-rect'" (click)="setMode('draw-rect')" [disabled]="isGuest"><i class="material-icons">crop_square</i><span>矩形</span></button>
    <button type="button" [class.active]="tools.mode === 'draw-ellipse'" (click)="setMode('draw-ellipse')" [disabled]="isGuest"><i class="material-icons">circle</i><span>圓形</span></button>
    <button type="button" [class.active]="tools.mode === 'draw-polygon'" (click)="setMode('draw-polygon')" [disabled]="isGuest"><i class="material-icons">hexagon</i><span>多邊形</span></button>
    <button type="button" [class.active]="tools.mode === 'draw-freehand'" (click)="setMode('draw-freehand')" [disabled]="isGuest"><i class="material-icons">gesture</i><span>手繪</span></button>
    <button type="button" [class.active]="tools.mode === 'draw-text'" (click)="setMode('draw-text')" [disabled]="isGuest"><i class="material-icons">title</i><span>文字</span></button>
    <div class="hint">空白處長按 1 秒：紅色平面 Ping<br>Alt+長按：警告 Ping<br>Shift+長按(GM)：紅色立體 Ping（朝天）＋拉視角</div>
  </div>
</div>
