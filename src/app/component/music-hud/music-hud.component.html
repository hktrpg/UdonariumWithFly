<div class="music-hud" *ngIf="visible" [class.is-collapsed]="collapsed" [style.left.px]="left" [style.top.px]="top">
  <!-- Collapsed: one row — drag · 3 plays · chevron -->
  <div class="hud-row" *ngIf="collapsed" (pointerdown)="startDrag($event)">
    <button type="button" class="hud-drag" [attr.title]="'musicHud.move' | i18n" [attr.aria-label]="'musicHud.move' | i18n">
      <i class="material-icons">drag_indicator</i>
    </button>
    <button
      type="button"
      class="slot-play"
      *ngFor="let i of slotIndexes"
      [class.is-on]="isPlaying(i)"
      [class.is-empty]="!hasAudio(i)"
      (pointerdown)="$event.stopPropagation()"
      (click)="togglePlay(i, $event)"
      (contextmenu)="onSlotContextMenu(i, $event)"
      [disabled]="!canControl"
      [attr.title]="trackName(i) + ' · ' + displayName(i)"
    >
      <i class="material-icons">{{ isPlaying(i) ? 'stop' : 'play_arrow' }}</i>
    </button>
    <button type="button" class="hud-collapse" (pointerdown)="$event.stopPropagation()" (click)="toggleCollapsed()"
      [attr.title]="'musicHud.expand' | i18n">
      <i class="material-icons">expand_more</i>
    </button>
  </div>

  <!-- Expanded -->
  <ng-container *ngIf="!collapsed">
    <header class="hud-head" (pointerdown)="startDrag($event)">
      <button type="button" class="hud-drag" [attr.title]="'musicHud.move' | i18n" [attr.aria-label]="'musicHud.move' | i18n">
        <i class="material-icons">drag_indicator</i>
      </button>
      <span class="hud-title">{{ 'musicHud.title' | i18n }}</span>
      <button type="button" class="hud-open" (pointerdown)="$event.stopPropagation()" (click)="openLibrary()"
        [attr.title]="'musicHud.openLibrary' | i18n">
        <i class="material-icons">library_music</i>
      </button>
      <button type="button" class="hud-collapse" (pointerdown)="$event.stopPropagation()" (click)="toggleCollapsed()"
        [attr.title]="'musicHud.collapse' | i18n">
        <i class="material-icons">expand_less</i>
      </button>
    </header>

    <div class="slot-list">
      <div
        class="slot-row"
        *ngFor="let i of slotIndexes"
        [class.is-playing]="isPlaying(i)"
        [class.is-drop-target]="dropSlotIndex === i"
        (dragover)="onSlotDragOver($event, i)"
        (dragleave)="onSlotDragLeave(i)"
        (drop)="onSlotDrop($event, i)"
        (contextmenu)="onSlotContextMenu(i, $event)"
        [attr.title]="canControl ? (('musicHud.dropHint' | i18n)) : null"
      >
        <span class="slot-badge">{{ trackName(i) }}</span>
        <button
          type="button"
          class="slot-name"
          (click)="onNameClick(i, $event)"
          (contextmenu)="onSlotContextMenu(i, $event)"
          [disabled]="!canControl"
          [attr.title]="canControl ? (('musicHud.pickAudio' | i18n) + ': ' + displayName(i)) : displayName(i)"
        >{{ displayName(i) }}</button>
        <button
          type="button"
          class="slot-play"
          [class.is-on]="isPlaying(i)"
          [class.is-empty]="!hasAudio(i)"
          (click)="togglePlay(i, $event)"
          (contextmenu)="onSlotContextMenu(i, $event)"
          [disabled]="!canControl"
          [attr.title]="!hasAudio(i) ? ('musicHud.pickAudio' | i18n) : (isPlaying(i) ? ('jukebox.stopAll' | i18n) : ('jukebox.play' | i18n))"
        >
          <i class="material-icons">{{ isPlaying(i) ? 'stop' : 'play_arrow' }}</i>
        </button>
      </div>
    </div>
  </ng-container>
</div>
