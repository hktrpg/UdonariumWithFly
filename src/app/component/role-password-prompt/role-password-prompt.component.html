<div class="settings-ui">
  <section class="card">
    <header class="card-head"><h3>{{ 'invite.passwordPromptLabel' | i18n }}</h3></header>
    <form #passwordForm="ngForm">
      <div class="field-row">
        <label class="field grow">
          <span>{{ 'invite.passwordPromptLabel' | i18n }}</span>
          <input
            #passwordInput
            type="password"
            [(ngModel)]="password"
            (input)="onInputChange()"
            (keypress.enter)="submit()"
            [ngModelOptions]="{standalone: true}"
            [placeholder]="'roomJoin.passwordPlaceholder' | i18n"
          />
        </label>
      </div>
      <footer class="actions">
        <button type="button" class="btn" (click)="cancel()">{{ 'roomJoin.cancel' | i18n }}</button>
        <button type="submit" class="btn btn-primary" (click)="submit()">{{ 'pass.submit' | i18n }}</button>
      </footer>
    </form>
    <p class="hint" *ngIf="help">{{ help }}</p>
  </section>
</div>
