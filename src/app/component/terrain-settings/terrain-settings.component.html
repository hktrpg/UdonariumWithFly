<div class="settings-ui dense object-settings terrain-settings" *ngIf="terrain; else emptyBlock" appFitPanel [fitMinHeight]="240">
  <section class="card card-dense">
    <div class="title-row">
      <label class="field grow">
        <span>{{ 'terrain.settings.name' | i18n }}</span>
        <input type="text" [(ngModel)]="terrain.name" [disabled]="GuestMode()" />
      </label>
    </div>
    <div class="image-grid">
      <div class="image-slot">
        <span class="image-label">{{ 'sheet.changeFloorImage' | i18n }}</span>
        <button type="button" class="image-frame" [class.image-frame-empty]="!terrain.floorImage?.url"
          (click)="openImage('floor')" [disabled]="GuestMode()">
          <img *ngIf="terrain.floorImage?.url" [src]="terrain.floorImage.url | safe: 'resourceUrl'" alt="" />
          <i *ngIf="!terrain.floorImage?.url" class="material-icons">add_photo_alternate</i>
        </button>
      </div>
      <div class="image-slot">
        <span class="image-label">{{ 'sheet.changeWallImage' | i18n }}</span>
        <button type="button" class="image-frame" [class.image-frame-empty]="!terrain.wallImage?.url"
          (click)="openImage('wall')" [disabled]="GuestMode()">
          <img *ngIf="terrain.wallImage?.url" [src]="terrain.wallImage.url | safe: 'resourceUrl'" alt="" />
          <i *ngIf="!terrain.wallImage?.url" class="material-icons">add_photo_alternate</i>
        </button>
      </div>
    </div>
    <div class="field-row wrap">
      <label class="field">
        <span>{{ 'note.fieldWidth' | i18n }}</span>
        <input type="number" min="0.5" step="0.5" [(ngModel)]="terrain.width" [disabled]="GuestMode()" />
      </label>
      <label class="field">
        <span>{{ 'terrain.settings.depth' | i18n }}</span>
        <input type="number" min="0.5" step="0.5" [(ngModel)]="terrain.depth" [disabled]="GuestMode()" />
      </label>
      <label class="field">
        <span>{{ 'note.fieldHeight' | i18n }}</span>
        <input type="number" min="0" step="0.5" [(ngModel)]="terrain.height" [disabled]="GuestMode()" />
      </label>
      <label class="field">
        <span>{{ 'mask.fieldAltitude' | i18n }}</span>
        <input type="number" step="0.5" [(ngModel)]="terrain.altitude" [disabled]="GuestMode()" />
      </label>
    </div>
  </section>

  <section class="card card-dense">
    <div class="field-row wrap">
      <label class="field grow">
        <span>{{ 'terrain.settings.mode' | i18n }}</span>
        <select [ngModel]="terrain.mode" (ngModelChange)="setMode(+$event)" [disabled]="GuestMode()">
          <option *ngFor="let opt of modeOptions" [ngValue]="opt.value">{{ opt.labelKey | i18n }}</option>
        </select>
      </label>
      <label class="field grow">
        <span>{{ 'terrain.settings.slope' | i18n }}</span>
        <select [ngModel]="terrain.slopeDirection" (ngModelChange)="setSlopeDirection(+$event)"
          [disabled]="GuestMode() || !terrain.isSlope">
          <option *ngFor="let opt of slopeOptions" [ngValue]="opt.value">{{ opt.labelKey | i18n }}</option>
        </select>
      </label>
    </div>
    <div class="check-row tight">
      <label><input type="checkbox" [ngModel]="terrain.isSlope" (ngModelChange)="setAppearanceFlag('isSlope', $event)" [disabled]="GuestMode()" /> {{ 'terrain.settings.isSlope' | i18n }}</label>
      <label><input type="checkbox" [ngModel]="terrain.isSurfaceShading" (ngModelChange)="setAppearanceFlag('isSurfaceShading', $event)" [disabled]="GuestMode()" /> {{ 'terrain.settings.surfaceShading' | i18n }}</label>
      <label><input type="checkbox" [ngModel]="terrain.isDropShadow" (ngModelChange)="setAppearanceFlag('isDropShadow', $event)" [disabled]="GuestMode()" /> {{ 'terrain.settings.dropShadow' | i18n }}</label>
      <label><input type="checkbox" [ngModel]="terrain.isInteract" (ngModelChange)="setAppearanceFlag('isInteract', $event)" [disabled]="GuestMode()" /> {{ 'terrain.settings.interact' | i18n }}</label>
      <label><input type="checkbox" [ngModel]="terrain.affectsLight" (ngModelChange)="setAppearanceFlag('affectsLight', $event)" [disabled]="GuestMode()" /> {{ 'terrain.settings.affectsLight' | i18n }}</label>
      <label><input type="checkbox" [ngModel]="terrain.isLocked" (ngModelChange)="setAppearanceFlag('isLocked', $event)" [disabled]="GuestMode()" /> {{ 'terrain.settings.locked' | i18n }}</label>
      <label><input type="checkbox" [ngModel]="terrain.isAltitudeIndicate" (ngModelChange)="setAppearanceFlag('isAltitudeIndicate', $event)" [disabled]="GuestMode()" /> {{ 'terrain.settings.altitudeIndicate' | i18n }}</label>
    </div>
  </section>

  <section class="card card-dense footer-actions actions tight">
    <button type="button" class="btn btn-sm" (click)="importXml()" [disabled]="GuestMode()">{{ 'sheet.import' | i18n }}</button>
    <button type="button" class="btn btn-sm" [disabled]="isSaveing || GuestMode()" (click)="saveToXML()">
      {{ isSaveing ? (progresPercent + '%') : ('sheet.download' | i18n) }}
    </button>
  </section>
</div>
<ng-template #emptyBlock>
  <div class="settings-ui empty-hint">{{ 'terrain.settingsEmpty' | i18n }}</div>
</ng-template>
